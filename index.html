      // Compatibility shim for extensions intercepting window.fetch
      (function() {
        try {
          var _fetch = window.fetch ? window.fetch.bind(window) : undefined;
          var getter = function() { return _fetch; };
          var setter = function(fn) { _fetch = fn; };

          try {
            Object.defineProperty(window, 'fetch', {
              get: getter,
              set: setter,
              configurable: true,
              enumerable: true
            });
          } catch (e) {}

          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: getter,
                set: setter,
                configurable: true,
                enumerable: true
              });
            }
          } catch (e) {}

          try {
            if (typeof globalThis !== 'undefined' && globalThis !== window) {
              Object.defineProperty(globalThis, 'fetch', {
                get: getter,
                set: setter,
                configurable: true,
                enumerable: true
              });
            }
          } catch (e) {}
        } catch (err) {}
      })();
    </script>
